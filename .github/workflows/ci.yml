name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notifications
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d notifications"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - run: python3 -m compileall -q src scripts
      - run: scripts/test-disposable-postgres.sh tests/fixtures/quant-notifications.json
      - run: scripts/test-image-contract.sh guillotine-notifications:ci
      - run: git diff --check

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/strangla/guillotine-notifications/service:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
