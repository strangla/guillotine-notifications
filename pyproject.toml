[project]
name = "guillotine-notifications"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pydantic-settings>=2.0"]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
